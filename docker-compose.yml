services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-companion-brain-postgres
    environment:
      POSTGRES_DB: ai_companion_brain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
